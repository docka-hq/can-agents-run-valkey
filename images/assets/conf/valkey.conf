# Valkey 9.1 (valkey-bundle) - storefront cache / search server
bind 127.0.0.1 -::1
port 6379
protected-mode yes
daemonize yes
pidfile /run/valkey/valkey.pid
logfile /var/log/valkey/valkey.log
dir /var/lib/valkey
# modules shipped with valkey-bundle (the official image loads all of them by default)
loadmodule /usr/lib/valkey/libjson.so
loadmodule /usr/lib/valkey/libsearch.so
loadmodule /usr/lib/valkey/libvalkey_bloom.so
loadmodule /usr/lib/valkey/libvalkey_ldap.so
