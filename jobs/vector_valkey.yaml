id: vector_valkey
difficulty: medium
surface: valkey
in_subset: true
task_version: 1
prompt: |
  `/data/articles.jsonl` holds 1,000 knowledge-base articles, one JSON object per line with the fields `id`, `title` and `embedding` (a list of 64 floats).

  Valkey 9.1 is installed and running on this machine at 127.0.0.1:6379 (config file: /etc/valkey/valkey.conf).

  Build semantic search over these articles in Valkey:
  1. Load all 1,000 articles into Valkey.
  2. Write `/app/search.py`. We will run it as `python3 /app/search.py < query.json`, where query.json contains one query embedding (a JSON list of 64 floats). It must print the `id`s of the 5 articles most similar to the query by cosine similarity, one per line, most similar first.

  The similarity search must run inside Valkey: `search.py` must not read `/data/articles.jsonl` and must not compute similarities itself. Leave the articles and everything `search.py` needs in Valkey when you finish.
sandbox:
  base_image: cari-kv-app:valkey-9.1
  preconditions:
  - Valkey 9.1.2 on 127.0.0.1:6379 with the image's bundled modules loaded, empty
  - '/data/articles.jsonl: 1,000 articles with 64-d embeddings'
  fixtures: []
  network: bridge
  entrypoint_mode: image
  ready_cmd: test -f /run/kv-ready
  memory: 1g
success:
  kind: shell_command
  payload: |
    /opt/kv-grader/bin/python - <<'KVGRADER_EOF'
