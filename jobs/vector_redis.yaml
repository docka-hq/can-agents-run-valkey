id: vector_redis
difficulty: medium
surface: redis
in_subset: true
task_version: 1
prompt: |
  `/data/articles.jsonl` holds 1,000 knowledge-base articles, one JSON object per line with the fields `id`, `title` and `embedding` (a list of 64 floats).

  Redis 8.10 is installed and running on this machine at 127.0.0.1:6379 (config file: /etc/redis/redis.conf).

  Build semantic search over these articles in Redis:
  1. Load all 1,000 articles into Redis.
  2. Write `/app/search.py`. We will run it as `python3 /app/search.py < query.json`, where query.json contains one query embedding (a JSON list of 64 floats). It must print the `id`s of the 5 articles most similar to the query by cosine similarity, one per line, most similar first.

  The similarity search must run inside Redis: `search.py` must not read `/data/articles.jsonl` and must not compute similarities itself. Leave the articles and everything `search.py` needs in Redis when you finish.
sandbox:
  base_image: cari-kv-app:redis-8.10
  preconditions:
  - Redis 8.10.2 on 127.0.0.1:6379 with the image's bundled modules loaded, empty
  - '/data/articles.jsonl: 1,000 articles with 64-d embeddings'
  fixtures: []
  network: bridge
  entrypoint_mode: image
  ready_cmd: test -f /run/kv-ready
  memory: 1g
success:
  kind: shell_command
  payload: |
    /opt/kv-grader/bin/python - <<'KVGRADER_EOF'
    CFG = {"cli": "redis-cli", "product": "redis", "queries": [[-0.151951, -0.018757, -0.052803, 0.231458, -0.057318, -0.017584, 0.235183, 0.068748, -0.04349, 0.340706, 0.036282, 0.2064, 0.089152, 0.068117, -0.094086, 0.0056, 0.04215, 0.180117, 0.043647, -0.023784, 0.135389, 0.195303, -0.061154, -0.116428, 0.146521, -0.056735, 0.059969, -0.019924, -0.211965, 0.226761, 0.059605, 0.014634, -0.009625, 0.071084, -0.06599, 0.005341, 0.024672, 0.061204, -0.188695, 0.230838, -0.113768, 0.038079, -0.103473, -0.1538, 0.124199, -0.106974, -0.119982, 0.053395, 0.062226, 0.069311, -0.044186, 0.123238, 0.165176, -0.186079, -0.074078, -0.136949, -0.050474, -0.096479, 0.228993, -0.079572, -0.054876, -0.000365, 0.147643, 0.175793], [-0.075737, -0.01804, -0.064432, -0.085475, 0.254973, -0.195307, 0.024935, -0.017557, 0.019702, 0.037525, -0.119982, -0.208455, -0.000617, -0.16246, 0.124802, 0.063785, 0.371432, -0.01829, -0.067856, -0.175256, 0.166873, 0.131389, 0.120421, -0.054071, 0.002506, -0.209939, 0.012399, -0.0515, -0.054983, 0.085686, 0.031688, 0.27661, -0.015414, -0.065021, 0.199399, -0.070044, 0.006523, 0.035821, 0.038365, 0.040205, -0.081552, -0.053676, -0.025846, -0.184048, 0.069703, -0.140309, 0.268115, 0.045232, -0.115671, 0.125352, -0.012439, 0.119944, 0.004485, -0.055817, 0.224991, 0.032405, -0.058791, -0.166242, -0.05237, -0.096876, 0.154751, 0.136907, 0.052419, 0.136372], [0.077542, 0.148834, 0.106482, -0.067393, 0.158311, 0.080677, -0.008053, -0.172176, 0.08817, -0.081012, -0.10319, -0.054847, -0.17236, 0.040942, 0.009449, -0.079738, 0.088344, 0.166492, -0.271681, -0.11197, -0.013013, -0.028522, -0.034688, -0.066077, -0.132814, 0.014103, 0.080765, -0.057437, -0.015613, -0.204057, -0.121631, -0.158542, 0.022374, -0.221923, -0.139419, -0.161895, -0.161736, 0.158525, 0.088216, 0.131183, 0.166846, -0.090613, 0.275249, 0.1544, 0.176386, 0.215016, -0.032173, 0.008428, -0.03345, -0.00454, 0.076154, -0.030298, -0.067039, -0.189183, 0.056278, 0.013307, 0.198752, -0.092567, 0.