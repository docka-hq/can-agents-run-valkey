id: vector_redis
difficulty: medium
surface: redis
in_subset: true
task_version: 1
prompt: |
  `/data/articles.jsonl` holds 1,000 knowledge-base articles, one JSON object per line with the fields `id`, `title` and `embedding` (a list of 64 floats).

  Redis 8.10 is installed and running on this machine at 127.0.0.1:6379 (config file: /etc/redis/redis.conf).

  Build semantic search over these articles in Redis:
  1. Load all 1,000 articles into Redis.
  2. Write `/app/search.py`. We will run it as `python3 /app/search.py < query.json`, where query.json contains one query embedding (a JSON list of 64 floats). It must print the `id`s of the 5 articles most similar to the query by cosine similarity, one per line, most similar first.

  The similarity search must run inside Redis: `search.py` must not read `/data/articles.jsonl` and must not compute similarities itself. Leave the articles and everything `search.py` needs in Redis when you finish.
